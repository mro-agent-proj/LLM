[project]
name = "mro-agent-ai"
version = "0.1.0"
description = "FastAPI AI service with LLM1 classification and checkpointed LLM2/3 investigation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-mcp-adapters>=0.1,<0.3",
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "jsonschema>=4.20,<5",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "aio-pika>=9.5,<10",
  "langgraph-checkpoint-postgres>=3,<4",
  "prometheus-client>=0.21,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]

[project.scripts]
mro-worker = "app.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

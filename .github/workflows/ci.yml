name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra openai
      # 합성 도구·모델로 실행하므로 OpenAI 키·MCP 서버가 필요 없습니다.
      - run: uv run --extra openai pytest -q
      - run: uv run --extra openai ruff check app tests scripts/evaluation
